# Hydrow Drag Controller - ESPHome Configuration
# 
# Hardware:
#   - ESP32 DevKit
#   - 2x IRLZ44N MOSFETs (GPIO25, GPIO26)
#   - MBR30100CT dual Schottky diode
#   - SSD1306 128x64 I2C OLED
#   - 10K Potentiometer
#
# Pin assignments:
#   GPIO25 -> 330Ω -> Q1 Gate (Coil 1)
#   GPIO26 -> 330Ω -> Q2 Gate (Coil 2)
#   GPIO34 -> Potentiometer wiper
#   GPIO16 -> OLED SDA
#   GPIO17 -> OLED SCL

esphome:
  name: hydrow-drag
  friendly_name: Hydrow Drag Controller
  on_boot:
    priority: -100
    then:
      - output.set_level:
          id: coil1_pwm
          level: 0%
      - output.set_level:
          id: coil2_pwm
          level: 0%
      - globals.set:
          id: drag_value
          value: '0'

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "Hydrow-Drag-Fallback"
    password: "hydrowdrag"

captive_portal:

web_server:
  port: 80

# ============================================
# GLOBAL VARIABLES
# ============================================

globals:
  - id: drag_value
    type: int
    restore_value: yes
    initial_value: '0'
  
  - id: control_source
    type: int
    restore_value: no
    initial_value: '0'  # 0 = HA, 1 = Pot

# ============================================
# I2C BUS FOR OLED
# ============================================

i2c:
  sda: GPIO16
  scl: GPIO17
  scan: true

# ============================================
# FONTS FOR DISPLAY
# ============================================

font:
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 36
  
  - file: "gfonts://Roboto@500"
    id: font_medium
    size: 14
  
  - file: "gfonts://Roboto@400"
    id: font_small
    size: 10

# ============================================
# OLED DISPLAY
# ============================================

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_display
    update_interval: 100ms
    lambda: |-
      int drag = id(drag_value);
      
      // === YELLOW ZONE (top 16 pixels) ===
      it.print(0, 0, id(font_small), "HYDROW DRAG");
      
      if (WiFi.isConnected()) {
        it.print(100, 0, id(font_small), "WiFi");
      } else {
        it.print(100, 0, id(font_small), "----");
      }
      
      // === BLUE ZONE (bottom 48 pixels) ===
      char buf[8];
      snprintf(buf, sizeof(buf), "%d%%", drag);
      
      int x_pos = 64;
      if (drag < 10) x_pos = 52;
      else if (drag < 100) x_pos = 40;
      else x_pos = 28;
      
      it.print(x_pos, 18, id(font_large), buf);
      
      // Progress bar
      int bar_width = (drag * 120) / 100;
      it.rectangle(4, 54, 120, 8);
      if (bar_width > 0) {
        it.filled_rectangle(5, 55, bar_width - 1, 6);
      }
      
      // Control source
      if (id(control_source) == 1) {
        it.print(4, 42, id(font_small), "LOCAL");
      } else {
        it.print(4, 42, id(font_small), "HOME ASSISTANT");
      }

# ============================================
# PWM OUTPUTS (25kHz for silent operation)
# ============================================

output:
  - platform: ledc
    pin: GPIO25
    id: coil1_pwm
    frequency: 25000 Hz
    
  - platform: ledc
    pin: GPIO26
    id: coil2_pwm
    frequency: 25000 Hz

# ============================================
# POTENTIOMETER INPUT
# ============================================

sensor:
  - platform: adc
    pin: GPIO34
    name: "Pot Raw"
    id: pot_raw
    update_interval: 50ms
    attenuation: 11db
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
    on_value:
      then:
        - lambda: |-
            int new_drag = (int)((x / 3.3) * 100.0);
            if (new_drag < 0) new_drag = 0;
            if (new_drag > 100) new_drag = 100;
            
            int current = id(drag_value);
            if (abs(new_drag - current) > 2) {
              id(drag_value) = new_drag;
              id(control_source) = 1;
              
              float level = new_drag / 100.0;
              id(coil1_pwm).set_level(level);
              id(coil2_pwm).set_level(level);
              
              id(drag_level).publish_state(new_drag);
            }

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    
  - platform: template
    name: "Current Drag"
    id: current_drag_sensor
    unit_of_measurement: "%"
    icon: "mdi:percent"
    lambda: 'return id(drag_value);'
    update_interval: 1s

# ============================================
# HOME ASSISTANT CONTROLS
# ============================================

number:
  - platform: template
    name: "Drag Level"
    id: drag_level
    icon: "mdi:rowing"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    set_action:
      - globals.set:
          id: drag_value
          value: !lambda 'return (int)x;'
      - globals.set:
          id: control_source
          value: '0'
      - output.set_level:
          id: coil1_pwm
          level: !lambda 'return x / 100.0;'
      - output.set_level:
          id: coil2_pwm
          level: !lambda 'return x / 100.0;'
      - logger.log:
          format: "HA set drag to %.0f%%"
          args: ['x']

button:
  - platform: template
    name: "Drag Off"
    icon: "mdi:power-off"
    on_press:
      - number.set:
          id: drag_level
          value: 0

  - platform: template
    name: "Drag Light (25%)"
    icon: "mdi:feather"
    on_press:
      - number.set:
          id: drag_level
          value: 25

  - platform: template
    name: "Drag Medium (50%)"
    icon: "mdi:speedometer-medium"
    on_press:
      - number.set:
          id: drag_level
          value: 50

  - platform: template
    name: "Drag Heavy (75%)"
    icon: "mdi:speedometer"
    on_press:
      - number.set:
          id: drag_level
          value: 75

  - platform: template
    name: "Drag Max (100%)"
    icon: "mdi:fire"
    on_press:
      - number.set:
          id: drag_level
          value: 100

  - platform: restart
    name: "Restart Controller"

# ============================================
# EMERGENCY STOP
# ============================================

switch:
  - platform: template
    name: "Emergency Stop"
    id: emergency_stop
    icon: "mdi:stop-circle"
    optimistic: true
    turn_on_action:
      - output.set_level:
          id: coil1_pwm
          level: 0%
      - output.set_level:
          id: coil2_pwm
          level: 0%
      - globals.set:
          id: drag_value
          value: '0'
      - number.set:
          id: drag_level
          value: 0
      - logger.log: "EMERGENCY STOP ACTIVATED"
    turn_off_action:
      - logger.log: "Emergency stop released"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
      
  - platform: template
    name: "Control Source"
    lambda: |-
      if (id(control_source) == 1) {
        return {"Local (Pot)"};
      } else {
        return {"Home Assistant"};
      }
    update_interval: 1s
